workflow:
  # Particle size from a DeepMASC mask, binning factor and delocalization box.
  # Inputs (user config):
  #   input.user       : reference_map_filepath (optional), defocus, target_resolution
  #   input.em_settings: EM_kV, EM_mics_apix, EM_Cs
    # Commands are the toolbox names in the system config (e.g. system/cryowork.yaml).

  ### 1. MASK OF THE REFERENCE MAP ###
  - name: create_mask-reference_volume
    command: deepmasc_contour
    requires: input.user.reference_map_filepath
    args:
      - "--input_map_path": {from: input.user.reference_map_filepath}
      - "--output_folder" : "$OUTDIR"
      - "-a"
      - "-p"
      # output: $BASEDIR/create_mask-reference_volume/prot_mask_final.mrc

  ### 2. PARTICLE SIZE ###
  - name: calc_size-reference_volume
    command: size_estimation
    requires: input.user.reference_map_filepath
    args:
      - "--volume": "$BASEDIR/create_mask-reference_volume/prot_mask_final.mrc"
      - "--json"
      - "--verbose"
  # output: diameter_A

  ### 3. BINNING ###
  - name: calc_binning
    command: find_binning_factor
    args:
      - "--pixel_size"       : {from: input.em_settings.EM_mics_apix}
      - "--target_resolution": {from: input.user.target_resolution}
      - "--json"
      - "--verbose"
  # output: rank1.binning_factor, rank1.binned_pixel_size_A_per_px, rank1.target_resolution_A (also rank2)

  ### 4. DELOCALIZATION BOX ###
  # resolution: the one reached at the binned pixel size (step 3)
  # diameter  : from step 2, or 0 without a reference map
  - name: calc_deloc_box
    command: size_matters
    args:
      - "--mode"      : "deloc"
      - "--voltage"   : {from: input.em_settings.EM_kV}
      - "--pixel_size": {from: workflow.calc_binning.output.rank1.binned_pixel_size_A_per_px}
      - "--defocus"   : {from: input.user.defocus}
      - "--cs"        : {from: input.em_settings.EM_Cs}
      - "--resolution": {from: workflow.calc_binning.output.rank1.target_resolution_A}
      - "--diameter"  : {from: workflow.calc_size-reference_volume.output.diameter_A, default: 0}
      - "--json"
      - "--verbose"
  # output: output.delocalization_max_width_A, output.delocalization_box_px

  ### 5. CS-SCHEMES PARAMETERS ###
  - name: cs_schemes
    command: css_parameters
    args:
      - "--workflow"                : "size_matters"
      # from the workflow
      - "--lbin_pixel_size"         : {from: workflow.calc_binning.output.rank1.binned_pixel_size_A_per_px}
      - "--lbin_binning_factor"     : {from: workflow.calc_binning.output.rank1.binning_factor}
      - "--lbin_compatible_boxes"   : {from: workflow.calc_binning.output.rank1.compatible_boxes}
      - "--lbin_deloc_box"          : {from: workflow.calc_deloc_box.output.delocalization_box_px}
      - "--particle_diameter"       : {from: workflow.calc_size-reference_volume.output.diameter_px, default: 0}
      # from the user inputs
      - "--particle_pixel_size"     : {from: input.em_settings.EM_mics_apix}
      - "--micrograph_lower_bound_x": {from: input.user.micrograph_lower_bound_x, default: 0}
      - "--micrograph_lower_bound_y": {from: input.user.micrograph_lower_bound_y, default: 0}
      - "--micrograph_upper_bound_x": {from: input.user.micrograph_upper_bound_x}
      - "--micrograph_upper_bound_y": {from: input.user.micrograph_upper_bound_y}
      - "--padding_pixels"          : {from: input.user.padding_pixels          , default: 0}
      - "--padding_angstrom"        : {from: input.user.padding_angstrom        , default: 0}
      - "--padding_percentage"      : {from: input.user.padding_percentage      , default: 0}
      - "--output-dir"              : "$OUTDIR"
      - "--json"
      - "--verbose"
