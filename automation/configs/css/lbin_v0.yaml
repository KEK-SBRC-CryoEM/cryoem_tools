css:
  ##### Common #####
  SS_comm_class2d_pmd:
    methods:
      - name: padding
        args:
          - particle_diameter : {from: workflow.calc_size-reference_volume.output.diameter}
          - pixel_size        : {from: workflow.calc_size-reference_volume.output.voxel_size}
          - padding_pixels    : {from: input.user.padding_pixels    , default: 0}
          - padding_angstrom  : {from: input.user.padding_angstrom  , default: 0}
          - padding_percentage: {from: input.user.padding_percentage, default: 0}
  SS_comm_optimal_pmd: {from: SS_comm_class2d_pmd}
  ## lbin ##
  SS_comm_lbin_angpix     : {from: workflow.calc_params-lbin.output.binned_pixel_size}
  SS_comm_lbin_ref3d_path : "$BASEDIR/create_volume-lbin/lbin.mrc"
  SS_comm_lbin_mask3d_path: "$BASEDIR/create_mask-lbin/prot_mask_final.mrc"
  SS_comm_lbin_ref3d_name : 
    methods: 
      - name:  get_filename_from_path
        args:
          - path: {from: SS_comm_lbin_ref3d_path}
  SS_comm_lbin_mask3d_name: 
    methods:  
      - name: get_filename_from_path
        args:
          - path: {from: SS_comm_lbin_mask3d_path}
  
  ##### 030_GTF_Create_Stack #####
  GTF_lbin_extract_mics_box    : {from: workflow.calc_extract_boxes-lbin.output.extract_box}
  GTF_lbin_extract_mics_0o95box:
    methods:  
      - name:  adjust_boxsize
        args:
          - box    : {from: GTF_lbin_extract_mics_box}
          - scaling: 0.95
          - even   : True
  GTF_lbin_extract_parts_box   : {from: workflow.calc_extract_boxes-lbin.output.rescaled_box}
  GTF_lbin_extract_parts_x_min :
    methods:  
      - name:  compute_extract_coordinates_min
        args:
          - boxsize    : {from: GTF_lbin_extract_mics_box}
          - lower_bound: {from: input.user.micrograph_lower_bound_x, default: 0}
  GTF_lbin_extract_parts_x_max :
    methods:  
      - name:  compute_extract_coordinates_max
        args:
          - boxsize    : {from: GTF_lbin_extract_mics_box}
          - upper_bound: {from: input.user.micrograph_upper_bound_x, default: 0}
  GTF_lbin_extract_parts_y_min :
    methods:  
      - name:  compute_extract_coordinates_min
        args:
          - boxsize    : {from: GTF_lbin_extract_mics_box}
          - lower_bound: {from: input.user.micrograph_lower_bound_y, default: 0}
  GTF_lbin_extract_parts_y_max :
    methods:  
      - name:  compute_extract_coordinates_max
        args:
          - boxsize    : {from: GTF_lbin_extract_mics_box}
          - upper_bound: {from: input.user.micrograph_upper_bound_y, default: 0}


